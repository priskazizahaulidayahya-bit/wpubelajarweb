<!DOCTYPE html>
<html lang="id  ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba elemen form di dalam table</title>
</head>

<body>
  <h1>Contoh elemen-elemen form pada html</h1>

  <form>
     <table>
     <tr>
      <td><label for="nama">Nama:</label></td>
      <td>
        <input type="text" name="nama" id="nama" placeholder="Masukkan nama">
      </td>
     </tr>
     <tr>
      <td><label for="password">Password:</label></td>
      <td>
        <input type="password" name="password" id="password">
      </td>
     </tr>
     <tr>
      <td><label for="email">Email:</label></td>
      <td><input type="email" name="email" id="email"> </td>
     </tr>
     <tr>
      <td><label for="angka">Angka:</label></td>
      <td><input type="number" name="angka" id="angka" min="0" max="100" step="5"></td>
     </tr>
     <tr>
      <td><label for="tanggal">Tanggal:</label></td>
      <td><input type="date" name="tanggal" id="tanggal"></td>
     </tr>
     <tr>
      <td><label for="warna">Pilih Warna:</label></td>
      <td><input type="color" name="warna" id="warna"></td>
     </tr>

     <tr>
      <td colspan="2">
        <button type="submit">Kirim</button>
      </td>
     </tr>
     
     </table>
    
  </form>  
</body>

</html>
